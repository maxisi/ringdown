  - defaults
dependencies:
  - python=3.12
  - numpy=2.2.6
  - lalsuite=7.26
  - h5py=3.16
  - arviz=0.19
  - pandas=2.2
  - qnm=0.4.4
  - seaborn=0.13
  - jupyterlab
  - tqdm
  - ipywidgets
  - ipykernel
  - numpyro=0.21.0
  - jax=0.11.1
  - parse>=1.20
  - pytables>=3.10,<4
  - scipy>=1.15,<1.16
  - pip:
    - git+https://github.com/maxisi/ringdown.git
