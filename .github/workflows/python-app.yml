# This workflow will install Python dependencies, run tests and lint.

name: test executables and lint

on:
  push:
    branches:
      - main
      - igwn
  pull_request:
    branches:
      - main
      - igwn

jobs:
  fast:
    name: lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-xdist pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Unit tests
      run: |
        pytest -n=auto --cov=ringdown --cov-report=xml

  slow:
    name: CLI config tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install .
    - name: Restore GWOSC example data
      id: gwosc-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          data/H-H1_LOSC_4_V2-1126259446-32.hdf5
          data/L-L1_LOSC_4_V2-1126259446-32.hdf5
        key: gwosc-gw150914-losc-4k-32s-v2
    - name: Download GWOSC example data
      run: bash tests/download_example_data.sh
    - name: Save GWOSC example data
      if: steps.gwosc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          data/H-H1_LOSC_4_V2-1126259446-32.hdf5
          data/L-L1_LOSC_4_V2-1126259446-32.hdf5
        key: gwosc-gw150914-losc-4k-32s-v2
    - name: Test fit
      run: bash tests/test_fit_config.sh
    - name: Test pipe
      run: bash tests/test_pipe_config.sh
    - name: Test scan
      run: bash tests/test_scan_config.sh
