[project]
name = "ringdown"
dynamic = ["version"]
description = "Bayesian analysis of black hole ringdowns in gravitational-wave data."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Maximiliano Isi", email = "max.isi@ligo.org" },
    { name = "Will M. Farr", email = "will.farr@stonybrook.edu" }
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy"
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "numpy==2.5.2",
    "lalsuite==7.26.15",
    "h5py~=3.16",
    "arviz>=0.23,<2",
    "pandas~=3.0",
    "qnm==0.4.4",
    "seaborn~=0.13",
    "numpyro==0.21.0",
    "jax==0.11.1",
    "parse>=1.20",
    "tables~=3.10",
    "scipy>=1.16,<1.19",
]

[project.scripts]
ringdown_fit = "ringdown.cli.ringdown_fit:main"
ringdown_pipe = "ringdown.cli.ringdown_pipe:main"
ringdown_scan = "ringdown.cli.ringdown_scan:main"
ringdown_pp_pipe = "ringdown.cli.ringdown_pp_pipe:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.optional-dependencies]
extra = [
    "gwpy~=4.0",
]

[project.urls]
Homepage = "https://github.com/maxisi/ringdown"
Documentation = "https://ringdown.readthedocs.io"
Issues = "https://github.com/maxisi/ringdown/issues"

[tool.uv]
dev-dependencies = [
    "ringdown",
    "jupyter",
    "pre-commit",
    "pytest"
]

[tool.uv.sources]
ringdown = { workspace = true }

[tool.hatch.version]
source = "vcs"
# Ignore non-version tags such as igwn-signoff-YYYYMMDD.
tag-pattern = 'v(?P<version>\d+\.\d+\.\d+)'

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "W"]
